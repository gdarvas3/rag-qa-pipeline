version: '3.8'

services:
  neo4j:
    image: neo4j:5.26
    container_name: rag-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/neo4jpassword
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p neo4jpassword 'RETURN 1;' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: rag-backend
    ports:
      - "8000:8000"
    env_file:
      - app.env
    volumes:
      - ./db:/app/db
      - ./data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
    command: sh -c "python -m src.data_handler && uvicorn api.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: .
    container_name: rag-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  neo4j_data: